name: 📖 User Story
description: A user-facing feature described from the end-user perspective
title: "[US] "
labels: ["user-story", "needs-refinement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## User Story
        Fill in all fields before moving this issue to **Ready for Sprint**.

  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a [role], I want [goal], so that [benefit].
      placeholder: "Als een burger wil ik een overzicht zien van lokale initiatieven, zodat ik kan deelnemen aan mijn gemeenschap."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met for this story to be considered done.
      placeholder: |
        - [ ] Gegeven dat de gebruiker ingelogd is, wanneer hij de homepage bezoekt, dan ziet hij een lijst van initiatieven
        - [ ] De lijst is gefilterd op gemeente
        - [ ] Elk initiatief toont naam, datum en status
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔴 Must Have
        - 🟠 Should Have
        - 🟡 Could Have
        - ⚪ Won't Have (this sprint)
    validations:
      required: true

  - type: input
    id: story-points
    attributes:
      label: Story Points
      placeholder: "3"

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options:
        - Sprint 0 – Setup
        - Sprint 1
        - Sprint 2
        - Sprint 3
        - Backlog (unplanned)
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes / Dependencies
      placeholder: "Depends on #12 (Strapi content type: Initiative)"
